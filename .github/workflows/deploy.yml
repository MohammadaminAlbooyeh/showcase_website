name: Deploy Website to S3

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node modules & npm
        uses: actions/cache@v3
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: |
          # Next.js 13+ (v15) requires 'output: "export"' in next.config.js/cjs
          npm run build

      - name: Prepare static export folder
        working-directory: frontend
        run: |
          # در نسخه جدید، build خودش خروجی static می‌دهد
          # مطمئن شوید next.config.js شامل output: 'export' باشد
          echo "Next.js build complete. Ready to sync to S3."

      - name: Sync to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read --delete frontend/out/
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}