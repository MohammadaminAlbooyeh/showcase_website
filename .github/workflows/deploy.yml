name: Deploy Website to S3

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node modules & npm
        uses: actions/cache@v3
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: |
          # Next.js 13+ (v15) requires 'output: "export"' in next.config.js/cjs
          npm run build

      - name: Prepare static export folder
        working-directory: frontend
        run: |
          # در نسخه جدید، build خودش خروجی static می‌دهد
          # مطمئن شوید next.config.js شامل output: 'export' باشد
          echo "Next.js build complete. Ready to sync to S3."

      - name: Show build output contents (debug)
        run: |
          echo "Listing frontend directory"
          ls -la
          echo "Listing frontend/out"
          ls -la frontend/out || true
          du -sh frontend/out || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 via AWS CLI
        run: |
          echo "Syncing frontend/out -> s3://${{ secrets.S3_BUCKET }}"
          aws s3 sync frontend/out s3://${{ secrets.S3_BUCKET }} --acl public-read --delete