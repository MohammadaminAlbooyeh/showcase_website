name: Deploy Website to S3

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node modules & npm
        uses: actions/cache@v3
        with:
          path: |
            frontend/.next/cache
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: |
          # Next.js 13+ (v15) requires 'output: "export"' in next.config.js/cjs
          npm run build

      - name: Prepare static export folder
        working-directory: frontend
        run: |
          # در نسخه جدید، build خودش خروجی static می‌دهد
          # مطمئن شوید next.config.js شامل output: 'export' باشد
          echo "Next.js build complete. Ready to sync to S3."

      - name: Show build output contents (debug)
        run: |
          echo "Listing frontend directory"
          ls -la
          echo "Listing frontend/out"
          ls -la frontend/out || true
          du -sh frontend/out || true

      - name: Ensure AWS region
        run: |
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "AWS_REGION=eu-north-1" >> $GITHUB_ENV
            echo "Warning: secrets.AWS_REGION is not set — defaulting to eu-north-1"
          else
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate required AWS/GitHub secrets
        run: |
          echo "Validating required GitHub Secrets (presence only)..."
          missing=0
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_ACCESS_KEY_ID: MISSING"
            missing=1
          else
            echo "AWS_ACCESS_KEY_ID: PRESENT"
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS_SECRET_ACCESS_KEY: MISSING"
            missing=1
          else
            echo "AWS_SECRET_ACCESS_KEY: PRESENT"
          fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "AWS_REGION: MISSING"
            missing=1
          else
            echo "AWS_REGION: PRESENT"
          fi
          if [ -z "${{ secrets.S3_BUCKET }}" ]; then
            echo "S3_BUCKET: MISSING"
            missing=1
          else
            echo "S3_BUCKET: PRESENT"
          fi
          if [ "$missing" -eq 1 ]; then
            echo "One or more required secrets are missing. Add them under Settings → Secrets → Actions." >&2
            exit 1
          fi
          echo "All required secrets appear present."

      - name: Sync to S3 via AWS CLI
        run: |
          echo "Syncing frontend/out -> s3://${{ secrets.S3_BUCKET }}"
          if [ ! -d frontend/out ] || [ -z "$(ls -A frontend/out)" ]; then
            echo "ERROR: frontend/out is missing or empty. Build may have produced no static files." >&2
            echo "Run locally: cd frontend && npm run build && ls -la out" >&2
            exit 1
          fi

          echo "Checking S3 bucket accessibility"
          if ! aws s3api head-bucket --bucket "${{ secrets.S3_BUCKET }}" >/dev/null 2>&1; then
            echo "ERROR: S3 bucket '${{ secrets.S3_BUCKET }}' not found or access denied." >&2
            echo "Ensure the bucket exists and the provided AWS credentials (repo secrets) have s3:ListBucket and s3:PutObject permissions." >&2
            exit 1
          fi

          set -o pipefail
          for i in 1 2 3; do
            echo "aws s3 sync attempt $i"
            if aws s3 sync frontend/out s3://${{ secrets.S3_BUCKET }} --delete; then
              echo "Sync succeeded"
              break
            fi
            if [ "$i" = "3" ]; then
              echo "ERROR: aws s3 sync failed after 3 attempts" >&2
              exit 1
            fi
            echo "Retrying in 5s..."
            sleep 5
          done